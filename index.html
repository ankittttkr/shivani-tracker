        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Premium Header */
        .header {

        .content { padding: 35px; flex-grow: 1; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        
        /* Elegant Cards */

            border-color: #00E1FF; color: #FF007A;

            box-shadow: 0 10px 20px rgba(0,0,0,0.04);
            animation: slideUp 0.4s ease forwards; opacity: 0;
        }
        .sub-btn:nth-child(1) { animation-delay: 0.1s; }
        .sub-btn:nth-child(2) { animation-delay: 0.2s; }
        .sub-btn:nth-child(3) { animation-delay: 0.3s; }
        .sub-btn:nth-child(4) { animation-delay: 0.4s; }

        .arrow-icon { color: #fff; background: #1e272e; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.3s; font-size: 20px;}

            background: #ffffff; border: 2px solid #f1f2f6; 
            margin-bottom: 20px; padding: 25px; border-radius: 22px;

        .custom-checkbox {

            let div = document.createElement("div");
            div.className = "day-card";
            if(i === activeDayNumber) {
                div.innerHTML = `🚀 Continue ${dayName}`;
                div.style.background = "#fff";
                div.style.borderColor = "#FF007A";
            } else {
                div.innerHTML = `✨ ${dayName}`;
            }
            div.onclick = () => openSubjects(dayName);
            grid.appendChild(div);
        }
    }

    function openSubjects(day) {
        currentDayStr = day;
        document.getElementById("daysDiv").classList.add("hidden");
        document.getElementById("subjectsDiv").classList.remove("hidden");
        document.getElementById("currentDayTitle").innerText = day;

        const container = document.getElementById("subjectsContainer");
        container.innerHTML = "";

        const subjects = Object.keys(syllabusData[day]);
        subjects.forEach((sub, index) => {
            let btn = document.createElement("button");
            btn.className = "sub-btn";
            btn.style.animationDelay = `${index * 0.1}s`;
            btn.innerHTML = `<span>📚 ${sub}</span> <span class="arrow-icon">→</span>`;
            btn.onclick = () => openTopics(sub);
            container.appendChild(btn);
        });
    }

    function openTopics(subject) {
        currentSubStr = subject;
        document.getElementById("subjectsDiv").classList.add("hidden");
        document.getElementById("topicsDiv").classList.remove("hidden");
        document.getElementById("currentSubjectTitle").innerText = `${currentDayStr} - ${subject}`;

        const list = document.getElementById("topicList");
        list.innerHTML = "";

        syllabusData[currentDayStr][subject].forEach((topic, index) => {
            const isChecked = localStorage.getItem(topic.id) === "true";
            let wrap = document.createElement("div");
            wrap.className = isChecked ? "topic-item done" : "topic-item";
            wrap.style.animationDelay = `${index * 0.1}s`;
            
            wrap.innerHTML = `
                <div class="checkbox-container">
                    <input type="checkbox" class="custom-checkbox" id="${topic.id}" onchange="toggleItem(this, '${topic.id}')" ${isChecked ? "checked" : ""}>
                    <span class="topic-text">${topic.name}</span>
                </div>
                <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(topic.q)}" target="_blank" class="yt-btn">▶ WATCH</a>
            `;
            list.appendChild(wrap);
        });
    }

    function toggleItem(checkbox, id) {
        // Saves memory locally to the specific device immediately
        localStorage.setItem(id, checkbox.checked);
        let parent = checkbox.closest('.topic-item');
        if(checkbox.checked) {
            parent.classList.add("done");
        } else {
            parent.classList.remove("done");
        }

        // Feature: Instant 100% Completion Check & Report
        checkIfDayIsFullyCompleted();
    }

    function goBack(to) {
        document.getElementById("topicsDiv").classList.add("hidden");
        document.getElementById("subjectsDiv").classList.add("hidden");
        document.getElementById("daysDiv").classList.add("hidden");
        
        if(to === 'days') {
            renderDaysGrid();
            document.getElementById("daysDiv").classList.remove("hidden");
        } else if(to === 'subjects') {
            document.getElementById("subjectsDiv").classList.remove("hidden");
            const cards = document.querySelectorAll('.sub-btn');
            cards.forEach(c => { c.style.animation = 'none'; c.offsetHeight; c.style.animation = null; });
        }
    }

    // --- TRACKING & REPORTING ENGINE ---

    // 1. Instant 100% Day Completion Reporter
    function checkIfDayIsFullyCompleted() {
        let activeDayKey = "Day " + activeDayNumber;
        let dayData = syllabusData[activeDayKey];
        let allDone = true;

        for (let sub in dayData) {
            dayData[sub].forEach(topic => {
                if (localStorage.getItem(topic.id) !== "true") {
                    allDone = false;
                }
            });
        }

        if (allDone) {
            let todayStr = new Date().toDateString();
            let memoryKey = `100_percent_sent_${activeDayKey}_${todayStr}`;
            
            // Send only once per day for 100% completion
            if (localStorage.getItem(memoryKey) !== "true") {
                sendDataToAnkit(todayStr, `🎉 [SUCCESS] Shivani completed 100% of ${activeDayKey}!`);
                localStorage.setItem(memoryKey, "true");
            }
        }
    }

    // 2. Daily 23:00 Auto Reporter
    function startSpyReporter() {
        setInterval(() => {
            let now = new Date();
            if (now.getHours() >= 23) {
                let todayStr = now.toDateString();
                if (localStorage.getItem("admin_report_date_colorful") !== todayStr) {
                    let activeDayKey = "Day " + activeDayNumber;
                    sendDataToAnkit(todayStr, `[NIGHT REPORT] Shivani's ${activeDayKey} Daily Status`);
                    localStorage.setItem("admin_report_date_colorful", todayStr);
                }
            }
        }, 60000);
    }

    function sendDataToAnkit(todayStr, emailSubjectTitle) {
        let activeDayKey = "Day " + activeDayNumber;
        let mailBody = `Hello Ankit,\n\nDevice Log: Tracker recorded new interactions.\nTime: ${new Date().toLocaleString()}\nTarget: ${activeDayKey}\n\n`;
        let total = 0, done = 0;

        let dayData = syllabusData[activeDayKey];
        for (let sub in dayData) {
            mailBody += `🔹 [${sub}]\n`;
            dayData[sub].forEach(topic => {
                total++;
                if (localStorage.getItem(topic.id) === "true") {
                    done++;
                    mailBody += `   ✅ Complete: ${topic.name}\n`;
                } else {
                    mailBody += `   ❌ Pending/Skipped: ${topic.name}\n`;
                }
            });
            mailBody += `\n`;
        }

        let percent = Math.round((done / total) * 100);
        mailBody += `📊 Total Progress for ${activeDayKey}: ${percent}%\nNote: Data is saved and synced from the user's specific device storage.`;

        const payload = {
            access_key: WEB3FORMS_ACCESS_KEY,
            subject: emailSubjectTitle,
            message: mailBody,
            from_name: "Shivani's Tracker Bot"
        };

        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).catch(err => console.log("Report failed, retrying later."));
    }
</script>
